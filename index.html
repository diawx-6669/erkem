<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дворец королевы Еркем</title>
<meta name="description" content="Подарок от брата Ералы на 7-летие Еркем: дворец с играми, призами и сюрпризами.">
<meta name="theme-color" content="#FF5FA2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M14 74 L9 31 L33 52 L50 17 L68 51 L91 29 L86 75 Q50 81 14 74Z' fill='%23FFC93C' stroke='%235B1A4A' stroke-width='6' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;800;900&family=Oi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/games.css">
<link rel="stylesheet" href="css/fx.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/polish.css">
<link rel="stylesheet" href="css/laptop.css">
</head>
<body>
<!-- Фильтры «дрожащей» линии для рисунков от руки -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="boil" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="1" result="n">
        <animate attributeName="seed" values="1;2;3;4" dur="0.6s" repeatCount="indefinite" calcMode="discrete"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-edge">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
  </defs>
</svg>

<div class="ambient" aria-hidden="true"></div>
<main id="app" aria-live="polite">
  <div class="boot">
    <div class="boot-crown"></div>
    <p>Открываем ворота дворца…</p>
  </div>
</main>

<button id="sound-toggle" class="sound-toggle" type="button" aria-label="Звук" aria-pressed="true">
  <svg viewBox="0 0 48 48" aria-hidden="true"><path class="spk" d="M7 19 h8 l11 -9 v28 l-11 -9 h-8z"/><path class="wave" d="M32 17 q5 7 0 14 M37 12 q9 12 0 24"/><path class="cross" d="M32 18 l12 12 M44 18 l-12 12"/></svg>
</button>
<div id="door-light" aria-hidden="true"></div>

<noscript><p class="noscript">Включите JavaScript, чтобы войти во дворец королевы Еркем.</p></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
